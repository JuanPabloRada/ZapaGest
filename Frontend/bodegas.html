<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZapaGest - Bodegas</title>
    <link rel="icon" href="img/logo software.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/bodegas.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


</head>

<body>

    <div class="app">

        <!-- MENÚ LATERAL -->
        <aside class="sidebar">

            <div class="sidebar-logo">
                <img src="img/logo principal.png" alt="ZapaGest">

            </div>

            <nav class="menu">

                <a href="dashboard.html" class="menu-item">
                    <i class="fa-solid fa-house"></i>
                    <span>Inicio</span>
                </a>

                <a href="bodegas.html" class="menu-item active">
                    <i class="fa-solid fa-shop"></i>
                    <span>Bodegas</span>
                </a>

                <a href="calidades.html" class="menu-item">
                    <i class="fa-solid fa-pen"></i>
                    <span>Calidades</span>
                </a>

                <a href="catalogo.html" class="menu-item">
                    <i class="fa-solid fa-folder-open"></i>
                    <span>Catálogo</span>
                </a>

                <a href="modelos.html" class="menu-item">
                    <i class="fa-solid fa-shoe-prints"></i>
                    <span>Modelos</span>
                </a>

                <a href="usuarios.html" class="menu-item">
                    <i class="fa-solid fa-users"></i>
                    <span>Usuarios</span>
                </a>


            </nav>



        </aside>

        <!-- CONTENIDO -->
        <main class="contenido">

            <header class="topbar">

                <div class="topbar-izq">
                    <button type="button" id="menuToggle" class="menu-toggle" aria-label="Mostrar u ocultar menú"
                        aria-expanded="true">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <img src="img/logo principal 2.png" class="topbar-logo" alt="ZapaGest">
                </div>


                <div class="usuario-menu">
                    <button class="usuario" id="usuarioBtn" aria-expanded="false">
                        <i class="fa-solid fa-circle-user avatar"></i>
                        <div class="usuario-info">
                            <strong></strong>
                            <small class="rol"></small>
                        </div>
                        <i class="fa-solid fa-chevron-down flecha"></i>
                    </button>

                    <div class="dropdown" id="usuarioDropdown">
                        <div class="dropdown-perfil">
                            <i class="fa-solid fa-circle-user"></i>
                            <div>
                                <strong></strong>
                                <small class="rol"></small>
                            </div>
                        </div>

                        <hr>

                        <!-- <a href="perfil.html" class="dropdown-item">
                            <i class="fa-solid fa-user"></i> Mi perfil
                        </a> -->

                        <button id="logoutButton" class="dropdown-item logout">
                            <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
                        </button>
                    </div>
                </div>

            </header>

            <section class="dashboard">

                <h1>Bodegas</h1>
                <p class="descripcion">
                    Registra los lugares donde guardas o vendes tu mercancía.
                </p>

                <div class="bodegas-grid">

                    <!-- FORMULARIO -->
                    <section class="panel">
                        <h2 id="tituloForm">Nueva bodega</h2>

                        <form id="bodegaForm" novalidate>

                            <div class="form-group">
                                <label for="nombre">Nombre</label>
                                <input type="text" id="nombre" name="nombre" placeholder="Ej. Local Principal"
                                    maxlength="60">
                            </div>

                            <div class="acciones-form">
                                <button type="submit" id="guardarBtn">Guardar bodega</button>
                                <button type="button" id="cancelarBtn" class="secundario" hidden>Cancelar</button>
                            </div>

                            <p id="mensaje" class="mensaje" role="status"></p>
                        </form>
                    </section>

                    <!-- LISTA -->
                    <section class="panel panel-lista">
                        <div class="panel-encabezado">
                            <h2>Mis bodegas</h2>
                            <span id="contador" class="contador">0 de 10</span>
                        </div>

                        <table class="tabla" id="tablaBodegas">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Estado</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>

                        <p id="vacio" class="vacio" hidden>
                            Aún no tienes bodegas. Crea la primera con el formulario.
                        </p>
                    </section>

                </div>

            </section>

        </main>

    </div>

    <script src="js/api.js"></script>
    <script src="js/menu-rol.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/bodegas.js"></script>

</body>

</html>
