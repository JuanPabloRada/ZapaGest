<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZapaGest - Calidades</title>
    <link rel="icon" href="img/logo software.png" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <!-- Comparte estilos con Bodegas (mismo diseño de formulario + tabla) -->
    <link rel="stylesheet" href="css/bodegas.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    

</head>

<body>

    <div class="app">

        <!-- MENÚ LATERAL -->
        <aside class="sidebar">

            <div class="sidebar-logo">
                <img src="img/logo principal.png" alt="ZapaGest">

            </div>

            <nav class="menu">

                <a href="dashboard.html" class="menu-item">
                    <i class="fa-solid fa-house"></i>
                    <span>Inicio</span>
                </a>

                <a href="bodegas.html" class="menu-item">
                    <i class="fa-solid fa-shop"></i>
                    <span>Bodegas</span>
                </a>

                <a href="calidades.html" class="menu-item active">
                    <i class="fa-solid fa-pen"></i>
                    <span>Calidades</span>
                </a>

                <a href="catalogo.html" class="menu-item">
                    <i class="fa-solid fa-folder-open"></i>
                    <span>Catálogo</span>
                </a>

                <a href="usuarios.html" class="menu-item">
                    <i class="fa-solid fa-users"></i>
                    <span>Usuarios</span>
                </a>


            </nav>



        </aside>

        <!-- CONTENIDO -->
        <main class="contenido">

            <header class="topbar">

                <div class="buscador">
                    <input type="text" id="searchInput" placeholder="Buscar...">
                </div>


                <div class="usuario-menu">
                    <button class="usuario" id="usuarioBtn" aria-expanded="false">
                        <i class="fa-solid fa-circle-user avatar"></i>
                        <div class="usuario-info">
                            <strong>Angie</strong>
                            <small>Administrador</small>
                        </div>
                        <i class="fa-solid fa-chevron-down flecha"></i>
                    </button>

                    <div class="dropdown" id="usuarioDropdown">
                        <div class="dropdown-perfil">
                            <i class="fa-solid fa-circle-user"></i>
                            <div>
                                <strong>Angie</strong>
                                <span>angie@zapagest.com</span>
                                <small>Administrador</small>
                            </div>
                        </div>

                        <hr>

                        <!-- <a href="perfil.html" class="dropdown-item">
                            <i class="fa-solid fa-user"></i> Mi perfil
                        </a> -->

                        <button id="logoutButton" class="dropdown-item logout">
                            <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
                        </button>
                    </div>
                </div>

            </header>

            <section class="dashboard">

                <h1>Calidades</h1>
                <p class="descripcion">
                    Define las calidades de tu negocio
                </p>

                <div class="bodegas-grid">

                    <!-- FORMULARIO -->
                    <section class="panel">
                        <h2>Nueva calidad</h2>

                        <form id="calidadForm" novalidate>

                            <div class="form-group">
                                <label for="nombre">Nombre</label>
                                <input type="text" id="nombre" name="nombre"
                                    placeholder="Ej. Original, Nacional, Importada" maxlength="40">
                            </div>

                            <button type="submit" id="guardarBtn">Guardar calidad</button>

                            <p id="mensaje" class="mensaje" role="status"></p>
                        </form>
                    </section>

                    <!-- LISTA -->
                    <section class="panel mis-bodegas">
                        <div class="panel-encabezado">
                            <h2>Mis calidades</h2>
                            <span id="contador" class="contador">0</span>
                        </div>

                        <table class="tabla" id="tablaCalidades">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>

                        <p id="vacio" class="vacio" hidden>
                            Aún no tienes calidades. Crea la primera con el formulario.
                        </p>
                    </section>

                </div>

            </section>

        </main>

    </div>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/calidades.js"></script>

</body>

</html>
