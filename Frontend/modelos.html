<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZapaGest - Modelos</title>
    <link rel="icon" href="img/logo software.png" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/bodegas.css"> <!-- tabla, mensajes, contador, botón editar -->
    <link rel="stylesheet" href="css/modelos.css">
    <link rel="stylesheet" href="css/catalogo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="app">

        <!-- MENÚ LATERAL -->
        <aside class="sidebar">

            <div class="sidebar-logo">
                <img src="img/logo principal.png" alt="ZapaGest">
            </div>

            <nav class="menu">

                <a href="dashboard.html" class="menu-item">
                    <i class="fa-solid fa-house"></i>
                    <span>Inicio</span>
                </a>

                <a href="bodegas.html" class="menu-item">
                    <i class="fa-solid fa-shop"></i>
                    <span>Bodegas</span>
                </a>

                <a href="calidades.html" class="menu-item">
                    <i class="fa-solid fa-pen"></i>
                    <span>Calidades</span>
                </a>

                <a href="catalogo.html" class="menu-item">
                    <i class="fa-solid fa-folder-open"></i>
                    <span>Catálogo</span>
                </a>

                <a href="modelos.html" class="menu-item active">
                    <i class="fa-solid fa-shoe-prints"></i>
                    <span>Modelos</span>
                </a>

                <a href="usuarios.html" class="menu-item">
                    <i class="fa-solid fa-users"></i>
                    <span>Usuarios</span>
                </a>

                <a href="inventario.html" class="menu-item">
                    <i class="fa-solid fa-boxes-stacked"></i>
                    <span>Inventario</span>
                </a>

                <a href="buscador.html" class="menu-item">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span>Buscar</span>
                </a>

            </nav>

        </aside>

        <!-- CONTENIDO -->
        <main class="contenido">

            <header class="topbar">

                <div class="topbar-izq">
                    <button type="button" id="menuToggle" class="menu-toggle" aria-label="Mostrar u ocultar menú"
                        aria-expanded="true">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <img src="img/logo principal 2.png" class="topbar-logo" alt="ZapaGest">
                </div>

                <div class="usuario-menu">
                    <button class="usuario" id="usuarioBtn" aria-expanded="false">
                        <i class="fa-solid fa-circle-user avatar"></i>
                        <div class="usuario-info">
                            <strong></strong>
                            <small class="rol"></small>
                        </div>
                        <i class="fa-solid fa-chevron-down flecha"></i>
                    </button>

                    <div class="dropdown" id="usuarioDropdown">
                        <div class="dropdown-perfil">
                            <i class="fa-solid fa-circle-user"></i>
                            <div>
                                <strong></strong>
                                <small class="rol"></small>
                            </div>
                        </div>

                        <hr>

                        <button id="logoutButton" class="dropdown-item logout">
                            <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
                        </button>
                    </div>
                </div>

            </header>

            <section class="dashboard">

                <h1>Modelos</h1>
                <p class="descripcion">
                    Consulta tus modelos y edítalos cuando lo necesites.
                </p>

                <section class="panel panel-lista">

                    <div class="barra-filtros">
                        <input type="text" id="filtroTexto" placeholder="Buscar por referencia o modelo..." class="buscador">
                        <select id="filtroMarca" aria-label="Filtrar por marca" class="desplegable">
                            <option value="">Todas las marcas</option>
                        </select>
                        <button type="button" id="btnBuscar" class="btn-azul">Buscar</button>
                        <button type="button" id="btnLimpiar" class="btn-limpiar" aria-label="Limpiar filtros">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                        <span id="contador" class="contador">0</span>
                    </div>

                    <div class="tabla-scroll">
                        <table class="tabla" id="tablaModelos">
                            <thead>
                                <tr>
                                    <th>Referencia</th>
                                    <th>Modelo</th>
                                    <th>Marca</th>
                                    <th>Combinaciones posibles</th>
                                    <th>Precios por calidad</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>

                    <p id="vacio" class="vacio" hidden>
                        Aún no tienes modelos. Crea el primero en <a href="catalogo.html">Catálogo</a>.
                    </p>
                    <p id="mensaje" class="mensaje" role="status"></p>
                </section>

            </section>

        </main>

    </div>

    <script src="js/api.js"></script>
    <script src="js/menu-rol.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/modelos.js"></script>

</body>

</html>
