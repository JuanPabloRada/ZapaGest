<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZapaGest - Usuarios</title>
    <link rel="icon" href="img/logo software.png" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/bodegas.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-logo"><img src="img/logo principal.png" alt="ZapaGest"></div>
            <nav class="menu">
                <a href="dashboard.html" class="menu-item"><i class="fa-solid fa-house"></i><span>Inicio</span></a>
                <a href="bodegas.html" class="menu-item"><i class="fa-solid fa-shop"></i><span>Bodegas</span></a>
                <a href="calidades.html" class="menu-item"><i class="fa-solid fa-pen"></i><span>Calidades</span></a>
                <a href="catalogo.html" class="menu-item"><i class="fa-solid fa-folder-open"></i><span>Catálogo</span></a>
                <a href="usuarios.html" class="menu-item active"><i class="fa-solid fa-users"></i><span>Usuarios</span></a>
            </nav>
        </aside>
        <main class="contenido">
            <header class="topbar">
                <div class="buscador"><input type="text" id="searchInput" placeholder="Buscar usuario..."></div>
                <div class="usuario-menu">
                    <button class="usuario" id="usuarioBtn" aria-expanded="false">
                        <i class="fa-solid fa-circle-user avatar"></i>
                        <div class="usuario-info"><strong></strong><small class="rol"></small></div>
                        <i class="fa-solid fa-chevron-down flecha"></i>
                    </button>
                    <div class="dropdown" id="usuarioDropdown">
                        <div class="dropdown-perfil">
                            <i class="fa-solid fa-circle-user"></i>
                            <div><strong></strong><span></span><small class="rol"></small></div>
                        </div>
                        <hr>
                        <button id="logoutButton" class="dropdown-item logout">
                            <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
                        </button>
                    </div>
                </div>
            </header>
            <section class="dashboard">
                <h1>Usuarios</h1>
                <p class="descripcion">Crea usuarios y asigna sus roles de acceso.</p>
                <div class="bodegas-grid">
                    <section class="panel">
                        <h2>Nuevo usuario</h2>
                        <form id="usuarioForm" novalidate>
                            <div class="form-group">
                                <label for="nombre">Nombre</label>
                                <input id="nombre" name="nombre" type="text" maxlength="100" required>
                            </div>
                            <div class="form-group">
                                <label for="username">Usuario</label>
                                <input id="username" name="username" type="text" maxlength="50" required>
                            </div>
                            <div class="form-group">
                                <label for="password">Contraseña (mínimo 6 caracteres)</label>
                                <input id="password" name="password" type="password" minlength="6" required>
                            </div>
                            <div class="form-group">
                                <label for="rol">Rol</label>
                                <select id="rol" name="rol" required>
                                    <option value="ADMIN">Administrador</option>
                                    <option value="VENDEDOR">Vendedor</option>
                                    <option value="DUENO">Dueño</option>
                                </select>
                            </div>
                            <button type="submit" id="guardarBtn">Crear usuario</button>
                            <p id="mensaje" class="mensaje" role="status"></p>
                        </form>
                    </section>
                    <section class="panel mis-bodegas">
                        <div class="panel-encabezado">
                            <h2>Usuarios registrados</h2>
                            <span id="contador" class="contador">0</span>
                        </div>
                        <table class="tabla" id="tablaUsuarios">
                            <thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Estado</th></tr></thead>
                            <tbody></tbody>
                        </table>
                        <p id="vacio" class="vacio" hidden>No hay usuarios registrados.</p>
                    </section>
                </div>
            </section>
        </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/usuarios.js"></script>
</body>
</html>
