# Nombre de la aplicación
spring.application.name=proyectoZapGest

# Puerto: Render lo entrega en la variable PORT; en local es 8080
server.port=${PORT:8080}

# Conexión a PostgreSQL (Asegúrate de que la BD 'zapagest_db' exista en Postgres)
# En la nube se llenan con variables de entorno; en local se usan los valores despues de ":"
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zapagest_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate: Crea o actualiza automáticamente las tablas en PostgreSQL desde Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Muestra las consultas SQL en la consola para depurar fácilmente
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# JWT_SECRET debe ser una clave aleatoria en Base64 de al menos 32 bytes.
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://127.0.0.1:5500,http://localhost:5500,http://localhost:3000}